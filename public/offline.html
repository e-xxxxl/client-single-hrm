<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — HRM Platform</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 22rem; margin: 1rem; padding: 2rem 1.5rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { margin: 1rem 0 0.25rem; font-size: 1.1rem; }
      p { margin: 0 0 1.25rem; font-size: 0.9rem; color: #64748b; line-height: 1.5; }
      button { padding: 0.55rem 1.1rem; font: inherit; font-size: 0.9rem; font-weight: 500; color: #fff; background: #1d4ed8; border: 0; border-radius: 0.4rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>HRM Platform needs a connection to load your organization's data. Nothing is stored on this device. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
